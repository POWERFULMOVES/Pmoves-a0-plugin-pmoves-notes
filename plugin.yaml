name: pmoves-notes
title: PMOVES.Notes Integration
description: Persistent note-taking integration with PMOVES.AI Open Notebook (SurrealDB). Auto-saves conversation summaries and reasoning traces with NATS event publishing.
version: 1.0.0
author: POWERFULMOVES
license: MIT
repository: https://github.com/POWERFULMOVES/a0-plugin-pmoves-notes

# PMOVES.AI Integration Requirements
pmoves:
  min_version: "1.0.0"

  services:
    - name: "Open Notebook"
      required: true
      url: "${OPEN_NOTEBOOK_API_URL:-http://open-notebook:8000}"
      description: "SurrealDB-based knowledge base for persistent notes"

    - name: "NATS"
      required: true
      url: "${NATS_URL:-nats://nats:pmoves@nats:4222}"
      description: "Message bus for event publishing"

  extension_points:
    - point: "message_loop_end"
      description: "Auto-save conversation summaries to Open Notebook after each message loop"
      priority: 10

    - point: "monologue_end"
      description: "Save reasoning traces to memory for persistent agent memory"
      priority: 10

  tools:
    - name: "save_note"
      description: "Save a note to Open Notebook with optional tags"
      parameters:
        - name: "content"
          type: "string"
          required: true
          description: "Note content to save"
        - name: "title"
          type: "string"
          required: false
          description: "Optional note title"
        - name: "tags"
          type: "array"
          required: false
          description: "Optional tags for categorization"

    - name: "search_notes"
      description: "Search existing notes in Open Notebook"
      parameters:
        - name: "query"
          type: "string"
          required: true
          description: "Search query"
        - name: "limit"
          type: "integer"
          required: false
          description: "Maximum results to return"

  events_published:
    - subject: "agent.notes.saved.v1"
      description: "Published when a note is created or updated"
      schema:
        note_id: "string"
        title: "string"
        tags: "array"
        timestamp: "string"

    - subject: "agent.notes.searched.v1"
      description: "Published when a note search is performed"
      schema:
        query: "string"
        results_count: "integer"
        timestamp: "string"

# Agent Zero Compatibility
agent_zero:
  min_version: "0.9.8"
  max_version: "1.0.0"

# Security
security:
  credentials_required: true
  credential_sources:
    - env: "OPEN_NOTEBOOK_API_TOKEN"
    - env: "OPEN_NOTEBOOK_API_URL"
  network_access:
    - host: "open-notebook"
      port: 8000
      description: "Open Notebook API"
    - host: "nats"
      port: 4222
      description: "NATS message bus"

# Tags for discoverability
tags:
  - pmoves
  - notes
  - persistence
  - open-notebook
  - memory
  - nats
